<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recorrido — Colección Digital INBAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
<style>
  :root{
    --guinda:#1e5b4f; --guinda-900:#1E5C3B;
    --verde:#1e5b4f; --verde-900:#1E5C3B;
    --oro:#8DC2B7; --arena:#DBD3B6;
    --tinta:#211a1c; --gris:#6f6a66;
    --linea:#e8e3da; --papel:#ffffff; --papel-2:#faf7f2;
    --display:"Fraunces",Georgia,serif;
    --sans:"Noto Sans",system-ui,sans-serif;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);color:var(--tinta);background:var(--papel);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1400px;margin:0 auto;padding:0 40px}
  .lbl{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gris);font-weight:500}

  header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--linea);padding:13px 0}
  .nav{display:flex;align-items:center;gap:30px}
  .brand{display:flex;align-items:center;gap:11px;font-family:var(--sans);font-size:19px;font-weight:500;color:var(--guinda)}
  .logo-wrap{position:relative;width:81px;height:29px;flex:none}
  .logo-wrap .logo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:brightness(0)}
  .brand-sep{width:1px;height:20px;background:var(--linea);flex:none}
  .brand-text{font-style:italic;font-weight:700}
  .menu{margin-left:auto;display:flex;gap:26px}
  .menu a{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta);position:relative;padding:4px 0}
  .menu a.active{color:var(--guinda)}
  .menu a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1.5px;background:var(--guinda);transition:width .35s var(--ease)}
  .menu a:hover::after,.menu a.active::after{width:100%}
  .menu-toggle{all:unset;box-sizing:border-box;display:none;flex-direction:column;justify-content:center;gap:5px;width:38px;height:38px;cursor:pointer;flex:none}
  .menu-toggle span{display:block;width:20px;height:2px;background:var(--tinta);margin:0 auto}
  @media(max-width:900px){ .menu{display:none} .menu-toggle{display:flex} }

  .progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--oro);z-index:120;transition:width .1s linear}

  /* ---------- PORTADA ---------- */
  .cover{position:relative;min-height:calc(100vh - 56px);display:flex;align-items:flex-end;overflow:hidden}
  .cover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cover .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,20,18,.28),rgba(0,20,18,.35) 45%,rgba(30,92,59,.92) 100%)}
  .cover .in{position:relative;z-index:2;color:#fff;padding:0 0 116px}
  .cover .in .lbl{color:var(--arena)}
  .cover h1{font-family:var(--display);font-weight:500;font-size:clamp(38px,6.4vw,84px);line-height:.98;letter-spacing:-.02em;margin:12px 0 14px;max-width:16ch}
  .cover .sub{font-size:16px;color:rgba(255,255,255,.92);max-width:52ch}
  .cover .facts{margin-top:18px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--arena)}
  .cover .actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:26px}
  .cover .start{display:inline-flex;align-items:center;gap:10px;background:var(--arena);color:var(--verde-900);padding:14px 26px;border-radius:40px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border:none;transition:.3s var(--ease)}
  .cover .start:hover{background:#fff;gap:14px}
  .cover .start.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
  .cover .start.ghost:hover{background:rgba(255,255,255,.12)}
  .scrollcue{position:absolute;right:40px;bottom:92px;z-index:2;color:rgba(255,255,255,.8);font-size:10px;letter-spacing:.3em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:8px}
  .scrollcue::after{content:"";width:1px;height:34px;background:linear-gradient(var(--arena),transparent);animation:cue 1.8s ease-in-out infinite}
  @keyframes cue{0%{transform:scaleY(.2);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}100%{transform:scaleY(.2);transform-origin:bottom}}

  /* ---------- NOTA DE SALA (intro) ---------- */
  .nota-sala{padding:80px 0;border-bottom:1px solid var(--linea)}
  .nota-sala .in{max-width:60ch}
  .nota-sala h2{font-family:var(--display);font-weight:500;font-size:clamp(24px,3.2vw,38px);line-height:1.15;margin:10px 0 14px}
  .nota-sala p{font-size:16px;color:var(--tinta)}

  /* ---------- DIVISOR DE CAPÍTULO ---------- */
  .ch-divider{padding:70px 0 26px;display:flex;align-items:baseline;gap:20px}
  .ch-divider .ch-num{font-family:var(--display);font-style:italic;color:var(--oro);font-size:clamp(30px,4vw,56px);line-height:1}
  .ch-divider h2{font-family:var(--display);font-weight:500;font-size:clamp(26px,3.6vw,46px);letter-spacing:-.01em}

  /* ---------- SCROLLYTELLING ---------- */
  .tour{display:grid;grid-template-columns:56% 44%;gap:0;align-items:start;position:relative}
  .tour-media{position:sticky;top:56px;height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center;background:var(--verde-900);overflow:hidden}
  .frame{position:relative;width:100%;height:100%;overflow:hidden}
  .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease),opacity .35s ease;will-change:transform}
  .caption{position:absolute;left:22px;bottom:20px;z-index:3;background:rgba(0,20,18,.55);color:#fff;font-size:12px;letter-spacing:.02em;padding:8px 14px;border-radius:20px;max-width:70%;backdrop-filter:blur(4px)}
  .medlabel{position:absolute;right:18px;top:16px;z-index:3;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--arena)}
  .tour-steps{padding:0 0 0 6%}
  .beat{min-height:82vh;display:flex;flex-direction:column;justify-content:center;padding:40px 0;scroll-margin-top:80px}
  .beat .num{font-family:var(--display);color:var(--oro);font-size:14px;letter-spacing:.04em}
  .beat h3{font-family:var(--display);font-weight:500;font-size:clamp(24px,3vw,38px);line-height:1.06;margin:8px 0 4px}
  .beat .au{font-style:italic;color:var(--gris);font-size:14px;margin-bottom:16px}
  .beat p{font-size:15.5px;max-width:46ch;color:var(--tinta)}
  .beat.detail p{color:var(--gris);font-size:14.5px}
  .beat .ficha-link{margin-top:18px;font-size:12px;letter-spacing:.06em;color:var(--guinda);display:inline-flex;gap:8px;transition:gap .3s}
  .beat .ficha-link:hover{gap:12px}
  .beat .det-badge{display:inline-block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--oro);border:1px solid var(--linea);border-radius:20px;padding:4px 10px;margin-bottom:12px;width:fit-content}
  .beat.detail .dt-h{font-family:var(--display);font-weight:500;font-size:clamp(20px,2.4vw,28px);line-height:1.1;margin-bottom:8px;color:var(--tinta)}

  /* ---------- INTERLUDIOS ---------- */
  .interludio{padding:76px 0}
  .interludio.quote{background:var(--papel-2);border-top:1px solid var(--linea);border-bottom:1px solid var(--linea);text-align:center}
  .interludio.quote p{font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(24px,3.4vw,40px);line-height:1.25;max-width:22ch;margin:0 auto;color:var(--guinda-900)}
  .interludio.quote span{display:block;margin-top:16px;font-family:var(--sans);font-style:normal;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris)}
  .interludio.context .ctx{max-width:62ch;border-left:3px solid var(--oro);padding-left:24px}
  .interludio.context h3{font-family:var(--display);font-weight:500;font-size:clamp(22px,2.8vw,32px);margin:6px 0 12px}
  .interludio.context p{font-size:15.5px;color:var(--tinta)}

  /* ---------- CIERRE (nota curatorial) ---------- */
  .closing{padding:90px 0 40px;background:var(--verde-900);color:#fff}
  .closing .in{max-width:64ch}
  .closing .lbl{color:var(--arena)}
  .closing h3{font-family:var(--display);font-weight:500;font-size:clamp(28px,3.6vw,46px);line-height:1.08;margin:12px 0 16px}
  .closing p{font-size:16px;color:rgba(255,255,255,.9)}
  .closing .sig{margin-top:18px;font-style:italic;color:var(--arena)}
  .closing .cta{display:inline-flex;align-items:center;gap:10px;margin-top:26px;background:var(--arena);color:var(--verde-900);padding:13px 24px;border-radius:40px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:.3s var(--ease)}
  .closing .cta:hover{background:#fff;gap:14px}
  .credits{background:var(--verde-900);color:#fff;padding:10px 0 70px}
  .credits .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;border-top:1px solid rgba(255,255,255,.2);padding-top:26px}
  .credits h5{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--arena);margin-bottom:8px}
  .credits p{font-size:13px;color:rgba(255,255,255,.85)}

  .rel{padding:60px 0 90px}
  .rel h4{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gris);margin-bottom:18px}
  .relgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
  .relcard{border:1px solid var(--linea);border-radius:12px;overflow:hidden;transition:.3s var(--ease)}
  .relcard:hover{border-color:var(--oro);transform:translateY(-4px)}
  .relcard img{width:100%;height:150px;object-fit:cover}
  .relcard .b{padding:16px 18px}
  .relcard .b b{font-family:var(--display);font-weight:500;font-size:18px}
  .relcard .b span{font-size:12px;color:var(--gris)}

  .backbar{margin:20px 0 4px}
  .back{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--guinda);cursor:pointer;background:none;border:none}
  .back:hover{gap:12px}
  footer{background:var(--guinda-900);color:#fff;padding:40px 0}
  .fbot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;color:#fff;font-size:12px}

  /* ---------- HUD ---------- */
  .hud{position:fixed;left:0;right:0;bottom:20px;z-index:90;display:flex;justify-content:center;pointer-events:none}
  .hud-in{pointer-events:auto;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border:1px solid var(--linea);border-radius:40px;padding:7px 8px 7px 16px;box-shadow:0 12px 30px -16px rgba(0,0,0,.45);flex-wrap:wrap;max-width:94vw;justify-content:center}
  .hud .cnt{font-size:13px;color:var(--tinta)}.hud .cnt b{color:var(--guinda)}
  .hud .sep{width:1px;height:20px;background:var(--linea)}
  .hud .idxbtn{border:none;background:none;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gris);cursor:pointer}
  .hud .idxbtn:hover{color:var(--guinda)}
  .hud .ic{all:unset;box-sizing:border-box;height:36px;min-width:36px;padding:0 10px;border-radius:20px;border:1px solid var(--linea);display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;color:var(--tinta);font-size:12px;letter-spacing:.06em;text-transform:uppercase;transition:.25s}
  .hud .ic:hover{border-color:var(--guinda);color:var(--guinda)}
  .hud .ic.on{background:var(--guinda);color:#fff;border-color:var(--guinda)}
  .hud .ic svg{width:16px;height:16px}
  .hud .nav-b{all:unset;box-sizing:border-box;width:36px;height:36px;border-radius:50%;border:1px solid var(--linea);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tinta);transition:.25s}
  .hud .nav-b:hover{background:var(--guinda);color:#fff;border-color:var(--guinda)}

  .index{position:fixed;inset:0;z-index:150;opacity:0;pointer-events:none;transition:opacity .3s}
  .index.open{opacity:1;pointer-events:auto}
  .index .bd{position:absolute;inset:0;background:rgba(0,20,18,.55);backdrop-filter:blur(3px)}
  .index .panel{position:absolute;right:0;top:0;bottom:0;width:min(90vw,420px);background:var(--papel);transform:translateX(100%);transition:transform .35s var(--ease);padding:28px;overflow:auto}
  .index.open .panel{transform:none}
  .index h3{font-family:var(--display);font-weight:500;font-size:24px;margin-bottom:6px}
  .index .cl{position:absolute;right:20px;top:20px;background:none;border:none;font-size:22px;color:var(--gris);cursor:pointer}
  .index .ch-h{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--oro);margin:16px 0 4px}
  .index a{display:flex;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--linea)}
  .index a img{width:56px;height:44px;object-fit:cover;border-radius:4px;flex:none}
  .index a .t{font-family:var(--display);font-weight:500;font-size:16px}
  .index a .m{font-size:12px;color:var(--gris)}
  .index a .n{margin-left:auto;font-family:var(--display);color:var(--oro);font-size:13px}

  .toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);background:var(--tinta);color:#fff;font-size:13px;padding:11px 18px;border-radius:30px;opacity:0;pointer-events:none;transition:.35s var(--ease);z-index:300}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:860px){
    .tour{grid-template-columns:1fr}
    .tour-media{height:44vh;top:56px}
    .tour-steps{padding:0 20px}
    .beat{min-height:70vh;padding:30px 0}
    .hud .idxbtn,.hud .ic{font-size:0}
    .hud .ic{padding:0;min-width:36px}
    .scrollcue{display:none}
    .cover .in{padding-bottom:180px}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation:none!important}
    .frame img{transition:opacity .2s ease!important;transform:none!important}
    html{scroll-behavior:auto}
  }
</style>
</head>

<header>

<script>
  const IMG=f=>'Img/obras/'+f+'.jpg';
  /* ---------------- CURADURÍA DE EJEMPLO ---------------- */
  const CURADURIAS={
    "paisaje-territorio":{
      titulo:"Paisaje y territorio",
      subtitulo:"El paisaje como género y como identidad: una mirada al cielo, la montaña y la tierra en el acervo del INBAL.",
      curador:"Curaduría INBAL", fecha:"2026",
      intro:{titulo:"Una sala sin muros",
        texto:"Durante más de un siglo, los artistas mexicanos volvieron una y otra vez sobre la misma pregunta: cómo mirar la tierra que habitan. Este recorrido reúne seis obras de cuatro acervos del INBAL —el Museo Nacional de Arte, el de Arte Moderno, el de la Estampa y el de San Carlos— que hicieron del paisaje mucho más que un telón de fondo. Del cielo incandescente de Dr. Atl a la sierra tallada en madera por el grabado, el territorio aparece aquí como un sujeto vivo: a la vez objeto de estudio científico y de arrobo místico, escenario de la historia patria y refugio íntimo. No hay una sola manera de mirar el paisaje, sino muchas, y todas conviven en el acervo nacional. Te sugerimos activar la música y la audioguía, bajar el ritmo y dejar que cada obra encuentre su detalle antes de pasar a la siguiente."},
      closing:{titulo:"Nota curatorial",
        texto:"Mirar el paisaje es también mirar cómo aprendimos a mirarlo. Cada obra de este recorrido propone una gramática distinta para nombrar el territorio —la atmósfera incandescente de Dr. Atl, la línea tallada del grabado, el paisaje como escenario de la historia, el horizonte tonal de la pintura moderna— y, sin embargo, todas coinciden en una misma intuición: el territorio no se contempla desde afuera, como un objeto ajeno, sino que se habita, se trabaja y se sueña desde dentro. En el acervo del INBAL, ese habitar toma forma de nube monumental, de lava en erupción, de sierra impresa y de campo labrado, repartido entre museos y técnicas que rara vez se muestran juntos. Reunirlos en un solo recorrido es también proponer una lectura: la de un país que, a lo largo de más de un siglo, no dejó de preguntarse qué significa pertenecer a su tierra. Ojalá salgas de aquí con la mirada un poco más despierta hacia el paisaje que te rodea todos los días.",
        sig:"— Curaduría INBAL, 2026"},
      credits:{textos:"Textos curatoriales de muestra, Colección Digital INBAL.",musica:"Música ambiental y audioguía: grabaciones de muestra, Colección Digital INBAL.",imagenes:"Imágenes del acervo INBAL: MUNAL, MAM, MUNAE y Museo Nacional de San Carlos."},
      relacionadas:[
        {titulo:"La mujer en el arte mexicano",file:"MAM_13154"},
        {titulo:"La estampa insurgente",file:"MUNAE_7506"}
      ],
      chapters:[
        {num:"I",titulo:"El cielo",
          stops:[
            {file:"MUNAL_14333",titulo:"La Nube",autor:"Gerardo Murillo, Dr. Atl",anio:1931,
              texto:"Dr. Atl convierte algo tan efímero como una formación de vapor en el sujeto absoluto del cuadro. La nube, monumental y casi geológica, no adorna el cielo: lo ocupa por completo, y flota sobre el valle como una presencia viva que parece respirar. Gerardo Murillo fue pintor, vulcanólogo y escritor, y esa doble mirada —la del artista y la del científico— atraviesa toda su obra: el cielo es a la vez fenómeno atmosférico y experiencia espiritual. Su obsesión por capturar la luz cambiante del paisaje mexicano lo llevó a inventar un medio propio, el Atlcolor, capaz de una intensidad luminosa que el óleo tradicional no le daba. Mira cómo la masa de vapor concentra toda la energía de la composición, mientras el valle, allá abajo, queda reducido a una franja mínima de tierra.",
              beats:[{x:50,y:38,zoom:1,caption:"La obra completa"},{x:60,y:26,zoom:2.2,caption:"La masa de vapor como sujeto",nota:"Fíjate en cómo Dr. Atl trabaja el volumen de la nube: no es una mancha plana, sino una arquitectura de luz con pliegues, sombras y bordes incandescentes. La pincelada gira sobre sí misma para dar la sensación de una masa que se hincha y avanza, como si el vapor tuviera peso y voluntad propia."},{x:34,y:72,zoom:2,caption:"El valle al pie del cielo",nota:"En el borde inferior, el valle apenas ocupa una franja estrecha de tierra. Esa desproporción es deliberada: al reducir el suelo al mínimo, el pintor nos obliga a levantar la vista y a entregar casi toda la superficie del cuadro al cielo, invirtiendo la jerarquía habitual del paisaje."}]},
            {file:"MAM_16575",titulo:"Fuego verde en el Paricutín",autor:"Dr. Atl",anio:null,
              texto:"En 1943, un volcán nació de la noche a la mañana en un campo de maíz michoacano. Dr. Atl —que llevaba décadas persiguiendo el fuego de la tierra— acampó durante meses al pie del Paricutín para pintarlo mientras crecía, con un riesgo que rozaba la temeridad. Aquí el paisaje deja de ser contemplación serena para volverse energía pura: lava incandescente, columnas de ceniza y ese resplandor verde imposible que da título a la obra. El Atlcolor le permite trabajar la superficie con una vibración casi fosforescente. No es un paisaje que se observa a la distancia, sino una fuerza geológica que el pintor vivió de cerca, casi como testigo de una creación del mundo.",
              beats:[{x:50,y:55,zoom:1,caption:"Vista general"},{x:52,y:42,zoom:2.3,caption:"El resplandor de la lava",nota:"Acércate a la zona del cráter: el Atlcolor permite superponer capas encendidas de rojo, naranja y ese verde ácido que da nombre a la obra. La materia pictórica se vuelve casi táctil, como si conservara el calor de la lava que Dr. Atl vio correr frente a sus ojos."}]}
          ],
          outro:{type:"context",titulo:"¿Qué es el Atlcolor?",texto:"Frustrado por los límites del óleo para atrapar la luz del cielo mexicano, Gerardo Murillo inventó a inicios del siglo XX un medio pictórico propio, al que bautizó —como a sí mismo— con la palabra náhuatl para el agua: Atlcolor. Eran barras sólidas de pigmento aglutinado con ceras y resinas que podían aplicarse casi en seco, frotarse, fundirse con calor o disolverse, sobre soportes tan diversos como el papel, la madera o el masonite. El resultado era una superficie de intensidad luminosa y textura poco habituales, capaz de sugerir el brillo del sol, el fuego de la lava o la transparencia del aire. Más que una técnica, el Atlcolor fue la herramienta con la que Dr. Atl persiguió durante toda su vida una obsesión casi imposible: pintar la atmósfera misma."}
        },
        {num:"II",titulo:"La historia en el paisaje",
          stops:[
            {file:"MUNAL_16095",titulo:"El descubrimiento del Pulque",autor:"José María Obregón",anio:1869,
              texto:"En la pintura académica del siglo XIX, el paisaje casi nunca aparece solo: es el escenario donde se representa la historia de la nación que se estaba inventando a sí misma. José María Obregón sitúa aquí un mito fundacional —el hallazgo del pulque y su ofrenda al soberano— en un entorno cuidadosamente idealizado, con arquitectura, vegetación y luz al servicio del relato. La naturaleza no es la protagonista, pero tampoco es neutra: ordena la composición, jerarquiza a los personajes y dignifica la escena, dándole a un origen prehispánico la solemnidad de la gran pintura de historia europea. Observa cómo el grupo de figuras se recorta contra el paisaje como sobre un telón teatral.",
              beats:[{x:50,y:45,zoom:1,caption:"La escena completa"},{x:40,y:40,zoom:2,caption:"Las figuras y su entorno",nota:"Observa cómo el grupo de personajes se dispone en friso, recortado contra la arquitectura y la vegetación. Cada gesto, cada mirada y cada objeto están calculados para narrar con claridad la escena, según las reglas de la pintura académica de historia que Obregón aprendió en la Academia de San Carlos."}]}
          ],
          outro:{type:"quote",text:"El paisaje no es un fondo: es el sujeto que aprende a mirarse a sí mismo.",by:"Nota curatorial"}
        },
        {num:"III",titulo:"La línea y la tierra",
          stops:[
            {file:"MUNAE_56",titulo:"El mil cumbres",autor:"Carlos Alvarado Lang",anio:1951,
              texto:"El grabado obliga a traducir todo el color y la atmósfera del paisaje a un lenguaje elemental: línea, mancha y contraste. En esta vista de la sierra, Carlos Alvarado Lang construye profundidad y distancia sin un solo tono intermedio, solo con la tensión entre el blanco del papel y el negro de la tinta. Cada cumbre es literalmente un ritmo tallado en la madera, un gesto físico del buril que el artista no puede corregir. La xilografía convierte el territorio en una partitura visual, y nos recuerda que el paisaje mexicano no solo se pintó: también se imprimió y se multiplicó, para circular más allá de los muros del museo.",
              beats:[{x:50,y:50,zoom:1,caption:"La estampa completa"},{x:55,y:35,zoom:2.2,caption:"El ritmo de las cumbres",nota:"Detente en la sucesión de montañas hacia el fondo: sin recurrir a un solo gris, Alvarado Lang crea distancia solo alternando planos de negro macizo y blanco luminoso. La profundidad no es óptica sino gráfica, construida por el ritmo de los cortes del buril sobre la madera."}]},
            {file:"MUNAE_7506",titulo:"El mezquital",autor:"Adolfo Mexiac",anio:1957,
              texto:"El territorio nunca es solo geografía: también es un espacio social, trabajado y habitado. Adolfo Mexiac, heredero de la tradición del Taller de Gráfica Popular, graba el mezquital no como una postal pintoresca sino como un paisaje vivido, donde la tierra árida del altiplano y la vida cotidiana de quienes la habitan aparecen entrelazadas. La aspereza del linóleo y del blanco y negro refuerza esa dureza: aquí el paisaje tiene textura de trabajo y de resistencia. En la gráfica mexicana del siglo XX, mirar la tierra fue muchas veces también una manera de mirar a su gente.",
              beats:[{x:50,y:55,zoom:1,caption:"Vista general"},{x:35,y:65,zoom:2,caption:"El primer plano habitado",nota:"En el primer término aparecen las huellas de la vida: vegetación seca, senderos y una presencia humana apenas sugerida. Mexiac no separa el paisaje de quienes lo trabajan; la aspereza del grabado es también un modo de dar dignidad a un territorio y a su gente."}]}
          ],
          outro:{type:"quote",text:"Cada cumbre es un ritmo tallado en la madera.",by:"Sobre la gráfica del paisaje"}
        },
        {num:"IV",titulo:"El horizonte",
          stops:[
            {file:"MNSC_50941",titulo:"Paisaje (copia Gedovius)",autor:"Germán Gedovius",anio:1908,
              texto:"Para cerrar, un paisaje de pura atmósfera y horizonte. Germán Gedovius, formado entre México y Europa, trabaja aquí con la sensibilidad tonal del simbolismo, donde importa menos el detalle topográfico que el estado de ánimo de la luz. Que esta obra se resguarde en el Museo Nacional de San Carlos —la casa del arte europeo en México— no es casual: nos recuerda que la manera en que aprendimos a mirar y a pintar nuestro territorio pasó siempre por un diálogo con otras tradiciones. Mirar el paisaje, al final del recorrido, es también mirar la larga historia de cómo aprendimos a representarlo.",
              beats:[{x:50,y:45,zoom:1,caption:"La obra completa"},{x:50,y:30,zoom:1.9,caption:"El horizonte y la luz",nota:"Todo el sentido de la obra se juega en la línea del horizonte y en la gradación de la luz. Gedovius disuelve el detalle en atmósfera: importa menos qué vemos que cómo se siente esa hora del día, en la mejor tradición del simbolismo tonal."}]}
          ]}
      ]
    }
  };

  const params=new URLSearchParams(location.search);
  const CUR=CURADURIAS[params.get('cur')]||CURADURIAS["paisaje-territorio"];
  const $=id=>document.getElementById(id);

  /* aplanar stops con índice global */
  const stopsFlat=[];CUR.chapters.forEach(ch=>ch.stops.forEach(s=>stopsFlat.push(s)));
  stopsFlat.forEach((s,i)=>s.g=i);
  const totalStops=stopsFlat.length;

  /* portada */
  $('coverImg').src=IMG(stopsFlat[0].file);$('coverImg').alt=CUR.titulo;
  $('cTitulo').textContent=CUR.titulo;$('cSub').textContent=CUR.subtitulo;
  $('cFacts').textContent=`${CUR.curador} · ${totalStops} paradas · ${CUR.fecha}`;
  document.title=CUR.titulo+' — Recorrido — Colección Digital INBAL';
  $('totNum').textContent=String(totalStops).padStart(2,'0');

  /* ---------------- construir flujo ---------------- */
  let html=`<section class="nota-sala"><div class="wrap in"><span class="lbl">Nota de sala</span><h2>${CUR.intro.titulo}</h2><p>${CUR.intro.texto}</p></div></section>`;
  CUR.chapters.forEach(ch=>{
    html+=`<div class="wrap ch-divider"><span class="ch-num">${ch.num}</span><h2>${ch.titulo}</h2></div>`;
    let beats='';
    ch.stops.forEach(s=>{
      s.beats.forEach((b,bi)=>{
        const data=`data-g="${s.g}" data-file="${s.file}" data-x="${b.x}" data-y="${b.y}" data-zoom="${b.zoom}" data-cap="${b.caption}"`;
        if(bi===0){
          beats+=`<div class="beat" ${data}><span class="num">${String(s.g+1).padStart(2,'0')} / ${String(totalStops).padStart(2,'0')}</span>
            <h3>${s.titulo}</h3><div class="au">${s.autor}${s.anio?', '+s.anio:''}</div>
            <p>${s.texto}</p>
            <a class="ficha-link" href="detalle-obra.html?obra=${s.file}">Ver ficha completa →</a></div>`;
        }else{
          beats+=`<div class="beat detail" ${data}><span class="det-badge">Detalle</span><h4 class="dt-h">${b.caption}</h4><p>${b.nota||''}</p></div>`;
        }
      });
    });
    html+=`<section class="chapter"><div class="tour"><div class="tour-media"><div class="frame">
      <img class="ch-img" data-file="${ch.stops[0].file}" src="${IMG(ch.stops[0].file)}" alt="">
      <span class="medlabel"></span><span class="caption"></span></div></div>
      <div class="tour-steps">${beats}</div></div></section>`;
    if(ch.outro){
      if(ch.outro.type==='quote') html+=`<section class="interludio quote"><div class="wrap"><p>“${ch.outro.text}”</p><span>${ch.outro.by}</span></div></section>`;
      else html+=`<section class="interludio context"><div class="wrap"><div class="ctx"><span class="lbl">Contexto</span><h3>${ch.outro.titulo}</h3><p>${ch.outro.texto}</p></div></div></section>`;
    }
  });
  html+=`<section class="closing"><div class="wrap in"><span class="lbl">${CUR.closing.titulo?'Cierre':''}</span><span class="lbl">${CUR.closing.titulo}</span><h3>${CUR.closing.titulo}</h3><p>${CUR.closing.texto}</p><p class="sig">${CUR.closing.sig}</p><a class="cta" href="colecciones.html">Ver estas obras en Colecciones →</a></div></section>`;
  html+=`<section class="credits"><div class="wrap"><div class="grid"><div><h5>Textos</h5><p>${CUR.credits.textos}</p></div><div><h5>Sonido</h5><p>${CUR.credits.musica}</p></div><div><h5>Imágenes</h5><p>${CUR.credits.imagenes}</p></div></div></div></section>`;
  html+=`<section class="rel"><div class="wrap"><h4>Otras curadurías</h4><div class="relgrid">${CUR.relacionadas.map(r=>`<a class="relcard" href="curadurias.html"><img src="${IMG(r.file)}" alt="${r.titulo}"><div class="b"><b>${r.titulo}</b><br><span>Ver en Curadurías →</span></div></a>`).join('')}</div></div></section>`;
  $('flow').innerHTML=html;

  /* limpiar doble lbl del cierre (dejar solo el título) */
  document.querySelectorAll('.closing .lbl').forEach((el,i)=>{if(i===0)el.remove();});

  /* índice */
  $('idxTitle').textContent=CUR.titulo;
  $('idxList').innerHTML=CUR.chapters.map(ch=>`<div class="ch-h">${ch.num} · ${ch.titulo}</div>`+ch.stops.map(s=>`<a data-go="${s.g}"><img src="${IMG(s.file)}" alt=""><div><div class="t">${s.titulo}</div><div class="m">${s.autor}</div></div><span class="n">${String(s.g+1).padStart(2,'0')}</span></a>`).join('')).join('');
  const index=$('index');
  $('idxBtn').onclick=()=>index.classList.add('open');
  $('idxClose').onclick=()=>index.classList.remove('open');
  index.querySelector('[data-ixclose]').onclick=()=>index.classList.remove('open');

  /* beats */
  const beatEls=[...document.querySelectorAll('.beat')];
  $('idxList').querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>{index.classList.remove('open');const g=+a.dataset.go;const t=beatEls.find(e=>+e.dataset.g===g);t&&t.scrollIntoView({behavior:'smooth',block:'center'});});

  /* motor scrollytelling */
  let activeIdx=0,lastStop=-1,narrOn=false;
  function activate(el){
    activeIdx=beatEls.indexOf(el);
    const g=+el.dataset.g;
    const media=el.closest('.chapter').querySelector('.ch-img');
    const cap=el.closest('.chapter').querySelector('.caption');
    const med=el.closest('.chapter').querySelector('.medlabel');
    if(media.dataset.file!==el.dataset.file){media.dataset.file=el.dataset.file;media.style.opacity='0';const n=new Image();n.onload=()=>{media.src=n.src;media.style.opacity='1';};n.src=IMG(el.dataset.file);}
    media.style.transformOrigin=el.dataset.x+'% '+el.dataset.y+'%';media.style.transform='scale('+el.dataset.zoom+')';
    cap.textContent=el.dataset.cap;med.textContent=stopsFlat[g].titulo;
    $('curNum').textContent=String(g+1).padStart(2,'0');
    if(g!==lastStop){lastStop=g;if(narrOn)speakStop(g);}
  }
  const io=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting)activate(e.target);});},{rootMargin:'-45% 0px -45% 0px',threshold:0});
  beatEls.forEach(el=>io.observe(el));
  activate(beatEls[0]);

  $('prevBtn').onclick=()=>beatEls[Math.max(0,activeIdx-1)].scrollIntoView({behavior:'smooth',block:'center'});
  $('nextBtn').onclick=()=>beatEls[Math.min(beatEls.length-1,activeIdx+1)].scrollIntoView({behavior:'smooth',block:'center'});

  /* progreso */
  const prog=$('progress');
  window.addEventListener('scroll',()=>{const h=document.body.scrollHeight-window.innerHeight;prog.style.width=(window.scrollY/h*100)+'%';},{passive:true});

  /* ---------------- AUDIO: música (pista real) ---------------- */
  const musicEl=$('musicEl');
  let musicOn=false;
  musicEl.volume=0.35;
  function musicToggle(){
    musicOn=!musicOn;
    if(musicOn) musicEl.play().catch(()=>toastMsg('No se pudo reproducir la música.')); else musicEl.pause();
    $('musicBtn').classList.toggle('on',musicOn);
  }
  function duck(on){ if(musicOn) musicEl.volume=on?0.12:0.35; }
  $('musicBtn').onclick=musicToggle;

  /* ---------------- AUDIO: audioguía (grabación real) ---------------- */
  const guideEl=$('guideEl');
  guideEl.addEventListener('play',()=>duck(true));
  guideEl.addEventListener('pause',()=>duck(false));
  guideEl.addEventListener('ended',()=>duck(false));
  function speakStop(g){lastStop=g;guideEl.currentTime=0;guideEl.play().catch(()=>toastMsg('No se pudo reproducir la audioguía.'));}
  function enableAudio(){if(!narrOn){narrOn=true;$('audioBtn').classList.add('on');}}
  $('audioBtn').onclick=()=>{
    narrOn=!narrOn;$('audioBtn').classList.toggle('on',narrOn);
    if(narrOn){speakStop(+beatEls[activeIdx].dataset.g);}else{guideEl.pause();}
  };

  /* portada: comenzar con audio */
  $('startBtn').onclick=()=>$('flow').scrollIntoView({behavior:'smooth'});
  $('startAudio').onclick=()=>{musicToggle();enableAudio();$('flow').scrollIntoView({behavior:'smooth'});setTimeout(()=>speakStop(0),700);};

  const toast=$('toast');let tt;function toastMsg(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),2200);}
</script>
</body>
</html>
